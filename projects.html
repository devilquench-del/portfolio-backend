<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="animations.css" />
    <style>
        .projects-page {
            min-height: 100vh;
            padding: 120px 50px 80px;
            background: #0a0a0a;
        }

        .projects-page h1 {
            text-align: center;
            font-size: 48px;
            color: #d4af37;
            margin-bottom: 50px;
            animation: slideInDown 1s ease-out;
        }

        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .project-item {
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 30px;
            transition: all 0.4s ease;
            animation: fadeInUp 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }

        .project-item::before {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(212, 175, 55, 0.1);
            transition: 0.5s;
        }

        .project-item:hover::before {
            top: 0;
        }

        .project-item:hover {
            transform: translateY(-15px);
            box-shadow: 0 25px 50px rgba(212, 175, 55, 0.3);
            border-color: #f5d572;
        }

        .project-item h3 {
            color: #d4af37;
            font-size: 24px;
            margin-bottom: 15px;
            transition: 0.3s;
            position: relative;
            z-index: 2;
        }

        .project-item:hover h3 {
            color: #f5d572;
            font-size: 26px;
        }

        .project-item p {
            color: #ccc;
            font-size: 16px;
            margin-bottom: 15px;
            line-height: 1.6;
            position: relative;
            z-index: 2;
        }

        .project-tech {
            font-size: 13px;
            color: #888;
            padding-top: 15px;
            border-top: 1px solid #222;
            position: relative;
            z-index: 2;
        }

        .project-tech strong {
            color: #d4af37;
        }

        .no-projects {
            text-align: center;
            color: #888;
            font-size: 18px;
            padding: 50px;
            grid-column: 1 / -1;
        }

        .view-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #d4af37;
            color: #0a0a0a;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.3s;
            position: relative;
            z-index: 2;
        }

        .view-btn:hover {
            background: #f5d572;
            transform: scale(1.05);
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            .projects-page {
                padding: 100px 30px 60px;
            }

            .projects-page h1 {
                font-size: 36px;
                margin-bottom: 30px;
            }

            .projects-container {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
            }

            .project-item {
                padding: 20px;
            }

            .project-item h3 {
                font-size: 18px;
            }

            .project-item p {
                font-size: 14px;
            }

            .project-tech {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .projects-page {
                padding: 80px 20px 40px;
            }

            .projects-page h1 {
                font-size: 28px;
                margin-bottom: 20px;
            }

            .projects-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .project-item {
                padding: 15px;
            }

            .project-item h3 {
                font-size: 16px;
            }

            .project-item p {
                font-size: 13px;
            }

            .project-tech {
                font-size: 11px;
            }

            .no-projects {
                font-size: 14px;
                padding: 30px;
            }
        }
    </style>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <h1 class="logo">MANOJ<span>👑</span></h1>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="admin.html" class="admin-link">Admin</a></li>
        </ul>
    </nav>

    <!-- PROJECTS PAGE -->
    <div class="projects-page">
        <h1>My Projects</h1>
        <div class="projects-container" id="projectsContainer">
            <!-- Projects will be loaded from backend -->
        </div>
    </div>

    <script>
        function renderEmptyProjects(message) {
            const projectsContainer = document.getElementById('projectsContainer');
            projectsContainer.textContent = '';
            const empty = document.createElement('div');
            empty.className = 'no-projects';
            empty.textContent = message;
            projectsContainer.appendChild(empty);
        }

        function renderProjects(projects) {
            const projectsContainer = document.getElementById('projectsContainer');
            projectsContainer.textContent = '';
            projects.forEach((project) => {
                const projectItem = document.createElement('div');
                projectItem.className = 'project-item';
                const title = document.createElement('h3');
                title.textContent = project.title;

                const desc = document.createElement('p');
                desc.textContent = project.desc;

                const projectTech = document.createElement('div');
                projectTech.className = 'project-tech';

                const techLabel = document.createElement('strong');
                techLabel.textContent = 'Technologies:';
                projectTech.appendChild(techLabel);
                projectTech.appendChild(document.createTextNode(` ${project.tech}`));

                projectItem.appendChild(title);
                projectItem.appendChild(desc);
                projectItem.appendChild(projectTech);
                projectsContainer.appendChild(projectItem);
            });
        }

        async function loadProjects() {
            try {
                const res = await fetch('https://portfolio-backend-4b4m.onrender.com/api/projects', { credentials: 'include' });
                const payload = await res.json();
                if (!payload || payload.success !== true || !Array.isArray(payload.data)) {
                    throw new Error('Invalid projects response');
                }

                const projects = payload.data
                    .map((project) => ({
                        title: typeof project?.title === 'string' ? project.title.trim() : '',
                        desc: typeof project?.desc === 'string' ? project.desc.trim() : '',
                        tech: typeof project?.tech === 'string' ? project.tech.trim() : ''
                    }))
                    .filter((project) => project.title && project.desc && project.tech);

                if (projects.length === 0) {
                    renderEmptyProjects('No projects added yet. Visit the admin panel to add projects.');
                    return;
                }

                renderProjects(projects);
            } catch (err) {
                if (typeof showToast === 'function') {
                    showToast('Failed to load projects from backend', 'error');
                } else {
                    console.error('Failed to load projects from backend', err);
                }
                renderEmptyProjects('No projects added yet. Visit the admin panel to add projects.');
            }
        }

        document.addEventListener('DOMContentLoaded', loadProjects);
    </script>
    <script src="script.js"></script>
    <script src="animations.js"></script>
</body>

</html>
