<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="animations.css" />
    <style>
        .contact-page {
            min-height: 100vh;
            padding: 120px 50px 80px;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contact-container {
            max-width: 600px;
            width: 100%;
        }

        .contact-container h1 {
            text-align: center;
            font-size: 48px;
            color: #d4af37;
            margin-bottom: 50px;
            animation: slideInDown 1s ease-out;
        }

        .contact-box {
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 40px;
            animation: fadeInUp 0.6s ease-out;
        }

        .contact-info {
            margin-bottom: 30px;
        }

        .contact-info h3 {
            color: #d4af37;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .contact-info p {
            color: #ccc;
            font-size: 16px;
            word-break: break-all;
        }

        .contact-info a {
            color: #d4af37;
            text-decoration: none;
            transition: 0.3s;
        }

        .contact-info a:hover {
            color: #f5d572;
            text-decoration: underline;
        }

        .contact-divider {
            height: 1px;
            background: #222;
            margin: 30px 0;
        }

        .social-links {
            text-align: center;
        }

        .social-links h3 {
            color: #d4af37;
            margin-bottom: 20px;
        }

        .social-button {
            display: inline-block;
            margin: 10px;
            padding: 12px 25px;
            background: #d4af37;
            color: #0a0a0a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
            border: none;
        }

        .social-button:hover {
            background: #f5d572;
            transform: scale(1.05);
        }

        .message-form {
            margin-top: 30px;
        }

        .message-form h3 {
            color: #d4af37;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #d4af37;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: #0f0f0f;
            border: 1px solid #d4af37;
            border-radius: 8px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #f5d572;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #d4af37;
            border: none;
            border-radius: 8px;
            color: #0a0a0a;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #f5d572;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
        }

        .no-contact {
            text-align: center;
            color: #888;
            font-size: 16px;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            .contact-page {
                padding: 100px 30px 60px;
            }

            .contact-container {
                max-width: 90%;
            }

            .contact-container h1 {
                font-size: 36px;
                margin-bottom: 30px;
            }

            .contact-box {
                padding: 30px;
            }

            .contact-info h3 {
                font-size: 16px;
            }

            .contact-info p,
            .contact-info a {
                font-size: 14px;
            }

            .contact-form-group label {
                font-size: 14px;
            }

            .contact-form-group input,
            .contact-form-group textarea {
                font-size: 14px;
                padding: 10px;
            }

            .submit-btn {
                font-size: 14px;
                padding: 10px 20px;
            }

            .social-button {
                padding: 10px 15px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .contact-page {
                padding: 80px 20px 40px;
            }

            .contact-container {
                max-width: 100%;
            }

            .contact-container h1 {
                font-size: 28px;
                margin-bottom: 20px;
            }

            .contact-box {
                padding: 20px;
            }

            .contact-info {
                margin-bottom: 20px;
            }

            .contact-info h3 {
                font-size: 14px;
                margin-bottom: 8px;
            }

            .contact-info p,
            .contact-info a {
                font-size: 13px;
                word-break: break-word;
            }

            .contact-divider {
                margin: 20px 0;
            }

            .social-links h3 {
                font-size: 14px;
            }

            .social-button {
                display: block;
                width: 100%;
                padding: 12px;
                font-size: 14px;
                margin: 8px 0;
            }

            .contact-form-group {
                margin-bottom: 12px;
            }

            .contact-form-group label {
                font-size: 13px;
            }

            .contact-form-group input,
            .contact-form-group textarea {
                font-size: 13px;
                padding: 8px;
            }

            .submit-btn {
                font-size: 13px;
                padding: 10px;
                width: 100%;
            }

            .no-contact {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <h1 class="logo">MANOJ<span>👑</span></h1>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="admin.html" class="admin-link">Admin</a></li>
        </ul>
    </nav>

    <!-- CONTACT PAGE -->
    <div class="contact-page">
        <div class="contact-container">
            <h1>Get In Touch</h1>
            <div class="contact-box">
                <!-- Contact Information -->
                <div class="contact-info">
                    <h3>📧 Email</h3>
                    <p><a href="mailto:manoj@example.com" id="contactEmailDisplay">manoj@example.com</a></p>
                </div>

                <div class="contact-info" id="phoneSection" style="display: none;">
                    <h3>📱 Phone</h3>
                    <p><a href="tel:" id="contactPhoneDisplay"></a></p>
                </div>

                <div class="contact-divider"></div>

                <!-- Social Links -->
                <div class="social-links">
                    <h3>Connect With Me</h3>
                    <a href="https://github.com" class="social-button" target="_blank" rel="noopener noreferrer">GitHub</a>
                    <a href="https://linkedin.com" class="social-button" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                    <a href="https://twitter.com" class="social-button" target="_blank" rel="noopener noreferrer">Twitter</a>
                </div>

                <!-- Contact Form -->
                <div class="message-form">
                    <h3>Send a Message</h3>
                    <form id="contactForm">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="senderName" placeholder="Your name" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="senderEmail" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea id="senderMessage" placeholder="Write your message..." rows="5" required></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Load contact information from localStorage
        function loadContactInfo() {
            const saved = localStorage.getItem('portfolioData');
            
            if (saved) {
                const data = JSON.parse(saved);
                if (data.contact) {
                    // Update email
                    if (data.contact.email) {
                        document.getElementById('contactEmailDisplay').textContent = data.contact.email;
                        document.getElementById('contactEmailDisplay').href = `mailto:${data.contact.email}`;
                    }
                    
                    // Update phone
                    if (data.contact.phone) {
                        const phoneSection = document.getElementById('phoneSection');
                        phoneSection.style.display = 'block';
                        const phoneDisplay = document.getElementById('contactPhoneDisplay');
                        phoneDisplay.textContent = data.contact.phone;
                        phoneDisplay.href = `tel:${data.contact.phone.replace(/\D/g, '')}`;
                    }
                }
            }
        }

        // Handle form submission (uses showToast provided by script.js)
        document.getElementById('contactForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('senderName').value;
            const email = document.getElementById('senderEmail').value;
            const message = document.getElementById('senderMessage').value;
            
            // Save message to localStorage
            let messages = JSON.parse(localStorage.getItem('contactMessages') || '[]');
            messages.push({
                name,
                email,
                message,
                timestamp: new Date().toLocaleString()
            });
            localStorage.setItem('contactMessages', JSON.stringify(messages));
            
            // show toast (script.js defines showToast)
            try { showToast('Thank you for your message! I will get back to you soon.', 'success'); } catch (err) { console.log('Toast unavailable:', err); }
            document.getElementById('contactForm').reset();
        });

        // Load contact info on page load
        window.addEventListener('load', loadContactInfo);
    </script>
    <script src="animations.js"></script>
</body>

</html>
